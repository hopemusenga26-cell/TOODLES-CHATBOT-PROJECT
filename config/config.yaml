# Group chatbot configuration.
# Edit group_id and subject once the coordinator assigns them.

group_id: "GROUP 30"          # e.g. "G014"
subject: "Data Science & Machine Learning"   # linear regression and model training

paths:
  books_dir: data/books                       # book PDFs (never commit these)
  manifest: data/book_manifest.json
  pages: data/processed/pages.jsonl           # stage 1 output
  ingest_report: data/processed/ingest_report.json
  passages: data/processed/passages.jsonl     # stage 2 output
  index_dir: data/index                       # stage 4 output
  eval_questions: data/evaluation_questions.json
  human_reviews: evaluation/human_reviews.json
  review_sheet: evaluation/answers_for_review.json
  report: evaluation/report.json
  chats: data/chats                           # saved conversations (kept out of Git)

ingestion:
  min_chars_per_page: 40       # pages with less text are flagged as empty
  scanned_page_ratio: 0.5      # if more than this share of pages is empty, treat the book as scanned
  ocr:
    enabled: true              # only used when Tesseract is installed
    language: eng
    dpi: 300

chunking:
  chunk_size_words: 220
  overlap_words: 40
  min_chunk_words: 20
  boilerplate_page_share: 0.2  # drop paragraphs repeated on this share of a book's pages (notices, headers)

embedding:
  # Replace with the project-approved model and revision when the coordinator publishes them.
  # Previous model: sentence-transformers/all-MiniLM-L6-v2 @ 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  model_name: BAAI/bge-small-en-v1.5                       # MIT
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  batch_size: 32
  max_seq_length: 256          # tokens per passage; 512 (the model's limit) is about 3x slower to index on CPU
  normalize: true
  query_prefix: "Represent this sentence for searching relevant passages: "   # recommended for BGE queries
  passage_prefix: ""           # e.g. "passage: " for e5 models

retrieval:
  top_k: 5
  # Validation results (20 answerable questions, right page in top 5): vector only 80%, + hybrid 80%,
  # + reranker 75% (+1.1 s), + 2 per book 70%. Hybrid kept for exact terms such as function names;
  # reranker and per-book cap are off.
  hybrid: true                 # add BM25 keyword search to vector search (merged by reciprocal rank fusion)
  candidates: 20               # passages each search returns before merging and reranking
  max_per_book: null           # e.g. 2 to force results from several books
  # v4 (chosen on the validation split, right page in top 5): v3 75%, + distinct pages 80%,
  # + book routing 85%. Skipping contents/index pages and 512-token embeddings made no difference.
  distinct_pages: true         # at most one passage per page in the results (citations are per page)
  book_routing: true           # when a question names a book (title or manifest alias), search that book on its own
  reranker:
    enabled: false
    model_name: cross-encoder/ms-marco-MiniLM-L6-v2       # Apache-2.0
    revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
    max_length: 384
  min_score: 0.67              # cosine similarity below this is treated as "no evidence"; set for bge-small:
                               # validation/probe questions in the books scored 0.72-0.88, off-topic ones 0.49-0.63
                               # (0.30 was used with all-MiniLM-L6-v2)

generation:
  # "hf" writes answers with the local Transformers model below.
  # "ollama" uses a compressed model served by a local Ollama install (faster on CPU; optional).
  # "extractive" quotes the best passage sentences (no language model; fast fallback and baseline).
  # Qwen2.5-0.5B-Instruct (revision 7ae557604adf67be50417f59c2c2f167def9a775) was tested and is
  # too small: it returns bare citation numbers.
  backend: ollama              # Toodles Ultra; v2 evaluation showed hf is as accurate but ~12x slower
  model_name: Qwen/Qwen2.5-1.5B-Instruct                   # Apache-2.0, about 3 GB
  revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
  max_new_tokens: 200
  max_passages: 3              # passages given to the model (retrieval still returns top_k)
  device: cpu
  dtype: bfloat16              # bfloat16: ~50-70 s/answer, ~3.8 GB RAM; float32: ~30-45 s but ~6.6 GB, too much when other apps are open (i5-1135G7, 16 GB)
  min_support: 0.4             # a sentence is kept only if this share of its key words appears in the cited passage
                               # (made-up sentences measured 0.00-0.21, correct paraphrases ~0.40-0.45; was 0.5)
  fallback_to_quotes: true     # if no model sentence can be verified, quote the books' best sentences instead of refusing
  # Optional fast mode: install Ollama (https://ollama.com), then run `ollama pull qwen2.5:1.5b`.
  ollama_model: qwen2.5:1.5b    # Q4_K_M, 0.92 GB, digest 65ec06548149b04c096a120e4a6da9d4017ea809c91734ea5631e89f96ddc57b
  ollama_url: http://localhost:11434
  ollama_keep_alive: 30m       # keep the model loaded between questions (Ollama's default is 5m)
  ollama_num_ctx: 2048         # prompts use at most ~1,500 tokens; 2048 instead of 4096 lets the model fit the 2 GB GPU
  ollama_num_gpu: 99           # all layers on the GPU (GeForce MX450, 2 GB: uses ~1.1 GB); remove to let Ollama decide
  adapter: null                # optional LoRA adapter folder for the hf backend (see the lora section)

lora:
  # Optional fine-tuning experiment (task 7): src/lora_data.py builds the training split,
  # src/lora.py trains, checks and merges adapters. See docs/lora_experiment.md.
  base_model: Qwen/Qwen2.5-0.5B-Instruct                   # Apache-2.0; small enough to train on a CPU laptop
  base_revision: 7ae557604adf67be50417f59c2c2f167def9a775
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  learning_rate: 2.0e-4
  epochs: 2
  grad_accum: 4                # optimizer update every 4 examples
  max_length: 1536             # tokens; longer examples are skipped
  dev_share: 0.08              # share of the training data held out to track overfitting
  seed: 42
  output_dir: artifacts/lora

app:
  name: TOODLES          # chatbot name: page heading and browser tab
  theme: dark              # starting look: dark or light (switch in the sidebar)
  # Answer writer selected when the chat page opens: "ollama" (Toodles Ultra) or "extractive"
  # (Toodles Instant). "hf" is no longer offered in the app. Evaluations still use generation.backend unless told otherwise.
  default_answer_writer: ollama
